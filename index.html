<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Excavation Get Together 2026</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<style>
/* (Your CSS unchanged — trimmed here for brevity) */
body {
    margin: 0;
    font-family: "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.card {
    background: #ffffff;
    border-radius: 18px;
    padding: 28px 26px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 12px 28px rgba(0,0,0,0.25);
    animation: fadeIn 0.4s ease-in-out;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
}

h1, h2 {
    text-align: center;
    margin-bottom: 22px;
    color: #4a148c;
}

label {
    font-weight: 600;
    margin-top: 14px;
    display: block;
    color: #34495e;
}

input, select {
    width: 100%;
    padding: 12px 14px;
    margin-top: 6px;
    border-radius: 10px;
    border: 1px solid #ccc;
    font-size: 16px;
    box-sizing: border-box;
}

input:focus, select:focus {
    outline: none;
    border-color: #764ba2;
    box-shadow: 0 0 6px rgba(118,75,162,0.45);
}

select {
    background: #fff;
}

/* RADIO GROUP */
.radio-group {
    display: flex;
    align-items: center;
    justify-content: space-evenly;
    gap: 18px;
    padding: 8px 12px;
    background: #f3e5f5;
    border-radius: 10px;
    margin-top: 8px;
}

.radio-group label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 16px;
    color: #4a148c;
    margin: 0;
    cursor: pointer;
}

.radio-group input[type="radio"] {
    margin: 0;
    accent-color: #764ba2;
}

/* BUTTON */
button {
    width: 100%;
    padding: 14px;
    margin-top: 26px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, #ff512f, #dd2476);
    color: #fff;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.1s ease;
}

button:hover {
    opacity: 0.92;
    transform: translateY(-1px);
}

.hidden {
    display: none;
}

/* DASHBOARD */
.dashboard-item {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    font-size: 18px;
    border-bottom: 1px dashed #ddd;
}

.dashboard-item span:last-child {
    font-weight: bold;
}

.total {
    margin-top: 18px;
    font-size: 22px;
    color: #e53935;
    font-weight: bold;
}

/* FLASH SCREEN */
.flash-screen {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999;
}

.flash-text {
    font-size: 32px;
    font-weight: bold;
    color: #4a148c;
    text-align: center;
    padding: 24px;
}

</style>
</head>

<body>

<div class="card">
<h1>Excavation Get Together 2026</h1>

<label>Area</label>
<select id="area" onchange="loadInvitees()" required></select>

<label>Invitee</label>
<select id="inviteeSelect" onchange="handleInvitee()">
  <option value="">-- Select Invitee --</option>
</select>

<div id="nameWrapper" style="display:none">
  <label>Invitee Name</label>
  <input id="inviteeName">
</div>

<label>Adults</label>
<input type="number" id="adults" min="0" value="0">

<label>With Driver</label>
<div class="radio-group">
  <label><input type="radio" name="driver" value="Yes"> Yes</label>
  <label><input type="radio" name="driver" value="No" checked> No</label>
</div>

<label>Children</label>
<input type="number" id="children" min="0" value="0">

<label>Mobile No</label>
<input id="mobile" maxlength="10">

<button onclick="submitForm()">Submit</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {
  getFirestore, collection, doc, setDoc, getDoc,
  getDocs, query, where, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

/* 🔹 AREAS – SINGLE SOURCE OF TRUTH */
const AREAS = [
 "Barora","Block II","Bastacolla","Kusunda","Katras","Sijua",
 "Govindpur","Lodna","EJ & PB","CV","Washery",
 "Excvn Dept. HQ","Other Dept. HQ","Workshops","Others"
];

/* 🔹 FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyDzZpfsxzbEm94xzztN3X07_9XKgaocrE0",
  authDomain: "excavation-jalsa-2026.firebaseapp.com",
  projectId: "excavation-jalsa-2026",
  storageBucket: "excavation-jalsa-2026.appspot.com",
  messagingSenderId: "894588492912",
  appId: "1:894588492912:web:061ac9ba3cb616d7ee68b5"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* 🔹 Populate Areas */
const areaSel = document.getElementById("area");
areaSel.innerHTML = `<option value="">-- Select Area --</option>`;
AREAS.forEach(a=>{
  areaSel.innerHTML+=`<option value="${a}">${a}</option>`;
});

/* 🔹 Load Invitees */
/* 🔹 AREA NORMALIZER (REQUIRED) */
function toAreaKey(value) {
  return value
    ?.toLowerCase()
    .replace(/[^a-z0-9]/g, "");
}

window.loadInvitees = async () => {
  const sel = document.getElementById("inviteeSelect");
  sel.innerHTML = `<option value="">-- Select Invitee --</option>`;
  document.getElementById("nameWrapper").style.display = "none";

  if (!areaSel.value) return;

  const areaKey = toAreaKey(areaSel.value);

  const q = query(
    collection(db, "registrations"),
    where("areaKey", "==", areaKey)
  );

  const snap = await getDocs(q);

  snap.forEach(d => {
    const data = d.data();
    sel.innerHTML += `
      <option value="${d.id}">
        ${data.inviteeName}
      </option>`;
  });

  sel.innerHTML += `<option value="__new__">➕ New Invitee</option>`;
};


/* 🔹 Invitee Selection */
window.handleInvitee = async ()=>{
  const sel = inviteeSelect.value;
  const wrap = document.getElementById("nameWrapper");

  if(sel==="__new__"){
    wrap.style.display="none";
    mobile.value="";
    inviteeName.value="";
    return;
  }
  if(!sel) return;

  wrap.style.display="none";
  mobile.value=sel;

  const snap = await getDoc(doc(db,"registrations",sel));
  if(!snap.exists()) return;

  const d=snap.data();
  mobile.value = d.mobile || "";
  adults.value=d.adults||0;
  children.value=d.children||0;
  document.querySelector(`input[name=driver][value="${d.driver?'Yes':'No'}"]`).checked=true;
};

/* 🔹 Submit */
window.submitForm = async () => {
  const isNew = inviteeSelect.value === "__new__";
  const mobileNo = mobile.value.trim();

  if (mobileNo.length !== 10) {
    alert("Enter valid mobile number");
    return;
  }
  if (isNew && !inviteeName.value.trim()) {
    alert("Enter invitee name");
    return;
  }

  // 🔑 decide document id
  const docId = isNew
    ? doc(collection(db, "registrations")).id
    : inviteeSelect.value;

  await setDoc(
  doc(db, "registrations", docId),
  {
    inviteeName: isNew ? inviteeName.value.trim() : undefined,
    adults: +adults.value || 0,
    children: +children.value || 0,
    driver: document.querySelector("input[name=driver]:checked").value,
    mobile: mobileNo,
    area: areaSel.value.trim(),
    areaKey: toAreaKey(areaSel.value), // 🔥 REQUIRED
    status: "SUBMITTED",
    updatedAt: serverTimestamp()
  },
  { merge: true }
);


  alert("✅ Response saved successfully");
};

</script>
</body>
</html>
