<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Excavation Get Together 2026</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<style>
body{
  margin:0;font-family:Segoe UI,sans-serif;
  background:linear-gradient(135deg,#667eea,#764ba2);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
}
.card{
  background:#fff;border-radius:18px;
  padding:26px;width:100%;max-width:420px;
  box-shadow:0 14px 30px rgba(0,0,0,.25);
}
h1{text-align:center;color:#4a148c}
label{font-weight:600;margin-top:12px;display:block}
input,select{
  width:100%;padding:12px;margin-top:6px;
  border-radius:10px;border:1px solid #ccc;font-size:15px;
}
.radio-group{
  display:flex;gap:24px;
  background:#f3e5f5;padding:10px;border-radius:10px;
}
button{
  margin-top:22px;width:100%;padding:14px;
  border:none;border-radius:12px;
  background:linear-gradient(135deg,#ff512f,#dd2476);
  color:#fff;font-size:17px;font-weight:bold;cursor:pointer;
}
.flash{
  position:fixed;inset:0;
  background:linear-gradient(135deg,#ff9a9e,#fad0c4);
  display:flex;align-items:center;justify-content:center;
  font-size:30px;font-weight:bold;color:#4a148c;
}
</style>
</head>

<body>

<div class="card">
<h1>Excavation Get Together 2026</h1>

<label>Area</label>
<select id="area" onchange="loadInvitees()" required></select>

<label>Invitee</label>
<select id="inviteeSelect" onchange="handleInvitee()">
  <option value="">-- Select Invitee --</option>
</select>

<div id="nameWrapper" style="display:none">
  <label>Invitee Name</label>
  <input id="inviteeName">
</div>

<label>Adults</label>
<input type="number" id="adults" min="0" value="0">

<label>With Driver</label>
<div class="radio-group">
  <label><input type="radio" name="driver" value="Yes"> Yes</label>
  <label><input type="radio" name="driver" value="No" checked> No</label>
</div>

<label>Children</label>
<input type="number" id="children" min="0" value="0">

<label>Mobile No</label>
<input id="mobile" maxlength="10">

<button onclick="submitForm()">Submit</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {
  getFirestore, collection, doc, setDoc, getDoc,
  getDocs, query, where, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

/* 🔹 AREAS – SINGLE SOURCE OF TRUTH */
const AREAS = [
 "Barora","Block II","Bastacolla","Kusunda","Katras","Sijua",
 "Govindpur","Lodna","EJ & PB","CV","Washery",
 "Excvn Dept. HQ","Other Dept. HQ","Workshops","Others"
];

/* 🔹 FIREBASE */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* 🔹 Populate Areas */
const areaSel = document.getElementById("area");
areaSel.innerHTML = `<option value="">-- Select Area --</option>`;
AREAS.forEach(a=>{
  areaSel.innerHTML+=`<option value="${a}">${a}</option>`;
});

/* 🔹 Load Invitees */
window.loadInvitees = async () => {
  const area = areaSel.value;
  const sel = document.getElementById("inviteeSelect");
  sel.innerHTML = `<option value="">-- Select Invitee --</option>`;
  document.getElementById("nameWrapper").style.display="none";

  if(!area) return;

  const q = query(collection(db,"registrations"),where("area","==",area));
  const snap = await getDocs(q);

  snap.forEach(d=>{
    sel.innerHTML+=`<option value="${d.id}">${d.data().inviteeName}</option>`;
  });
  sel.innerHTML+=`<option value="__new__">➕ New Invitee</option>`;
};

/* 🔹 Invitee Selection */
window.handleInvitee = async ()=>{
  const sel = inviteeSelect.value;
  const wrap = document.getElementById("nameWrapper");

  if(sel==="__new__"){
    wrap.style.display="block";
    mobile.value="";
    inviteeName.value="";
    return;
  }
  if(!sel) return;

  wrap.style.display="none";
  mobile.value=sel;

  const snap = await getDoc(doc(db,"registrations",sel));
  if(!snap.exists()) return;

  const d=snap.data();
  adults.value=d.adults||0;
  children.value=d.children||0;
  document.querySelector(`input[name=driver][value="${d.driver?'Yes':'No'}"]`).checked=true;
};

/* 🔹 Submit */
window.submitForm = async ()=>{
  const mobileNo=mobile.value.trim();
  const isNew=inviteeSelect.value==="__new__";

  if(mobileNo.length!==10 || (!inviteeName.value && isNew)){
    alert("Fill required fields");
    return;
  }

  await setDoc(doc(db,"registrations",mobileNo),{
    inviteeName:isNew?inviteeName.value:"",
    adults:+adults.value,
    children:+children.value,
    driver:document.querySelector("input[name=driver]:checked").value==="Yes",
    area:areaSel.value.trim(),
    mobile:mobileNo,
    updatedAt:serverTimestamp()
  },{merge:true});

  const f=document.createElement("div");
  f.className="flash";
  f.innerText="Welcome Excavation Jalsa 2026";
  document.body.appendChild(f);
  setTimeout(()=>f.remove(),1800);
};
</script>
</body>
</html>
