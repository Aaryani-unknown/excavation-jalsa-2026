<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>
<meta name="viewport" content="width=device-width">
<style>
body{
  margin:0;font-family:Segoe UI,sans-serif;
  background:#0f172a;color:#fff;padding:30px;
}
input{
  padding:12px;border-radius:10px;border:none;font-size:16px;
}
button{
  padding:12px 20px;border:none;border-radius:10px;
  background:#7c3aed;color:#fff;font-weight:bold;cursor:pointer;
}
.grid{
  margin-top:30px;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:20px;
}
.card{
  background:#fff;color:#000;
  padding:20px;border-radius:16px;
  text-align:center;font-size:22px;
  box-shadow:0 10px 24px rgba(0,0,0,.3);
}
.card span{font-size:40px;font-weight:bold}
</style>
</head>

<body>

<div id="login">
  <h2>Admin PIN</h2>
  <input id="pin" type="password">
  <button onclick="login()">Enter</button>
</div>

<div id="dash" style="display:none">
  <h2>Area Wise Invitee Count</h2>
  <div class="grid" id="grid"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore,collection,getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const AREAS=[
 "Barora","Block II","Bastacolla","Kusunda","Katras","Sijua",
 "Govindpur","Lodna","EJ & PB","CV","Washery",
 "Excvn Dept. HQ","Other Dept. HQ","Workshops","Others"
];

const firebaseConfig={
 apiKey:"YOUR_API_KEY",
 authDomain:"YOUR_PROJECT.firebaseapp.com",
 projectId:"YOUR_PROJECT_ID"
};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

window.login=async()=>{
  if(pin.value!=="1234"){alert("Wrong PIN");return;}
  login.style.display="none";
  dash.style.display="block";

  const counts={};
  AREAS.forEach(a=>counts[a]=0);

  const snap=await getDocs(collection(db,"registrations"));
  snap.forEach(d=>{
    const a=d.data().area?.trim();
    if(counts[a]!==undefined) counts[a]++;
  });

  const g=document.getElementById("grid");
  AREAS.forEach(a=>{
    g.innerHTML+=`
      <div class="card">
        ${a}<br><span>${counts[a]}</span>
      </div>`;
  });
};
</script>
</body>
</html>
